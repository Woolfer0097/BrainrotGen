repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
        args: ["--profile", "black"]

      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]
        args:
          [
            "--jobs=1",
            "--extend-ignore=E203,W503",
            "--per-file-ignores=tests/test_duration.py:E402,web/app.py:E402",
          ]
